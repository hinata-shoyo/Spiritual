<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-en="Videos - Guruji" data-hi="वीडियो - गुरुजी">
      Videos - Guruji

    <style>
      .videos-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .search-wrapper {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
      }

      .search-wrapper .search-container {
        margin: 0;
        width: 100%;
        max-width: 500px;
      }

      .videos-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-bottom: 40px;
      }

      .video-card {
        width: 350px;
        background: var(--bg-card);
        border-radius: var(--radius);
        padding: 12px 14px;
        box-shadow: var(--shadow-sm);
        transition:
          transform var(--transition),
          box-shadow var(--transition);
        border-left: 5px solid var(--primary);
        display: flex;
        flex-direction: column;
      }

      .video-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow);
      }

      .video-card-body {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .video-title {
        font-size: 1em;
        font-weight: bold;
        color: var(--primary);
        margin-bottom: 6px;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .video-description {
        color: var(--text-light);
        line-height: 1.6;
        font-size: 0.9em;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        flex: 1;
      }

      .video-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-hover);
      }

      .video-thumb-wrapper {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 12px;
        background: #000;
        cursor: pointer;
      }

      .video-thumb-wrapper img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .play-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60px;
        height: 60px;
        background: rgba(60, 26, 53, 0.85);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        transition: all var(--transition);
        pointer-events: none;
      }

      .video-thumb-wrapper:hover .play-button {
        background: var(--primary);
        transform: translate(-50%, -50%) scale(1.1);
      }

      .video-iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        margin:0;
      }

      .video-category {
        display: inline-block;
        background: var(--accent-light);
        color: var(--primary);
        padding: 3px 10px;
        border-radius: 10px;
        font-size: 0.78em;
        font-weight: bold;
        margin-top: 8px;
      }

      .pagination {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 40px;
      }

      .pagination button {
        background: var(--primary);
        color: var(--accent);
        border: none;
        padding: 12px 25px;
        border-radius: var(--radius-full);
        font-weight: bold;
        cursor: pointer;
        transition: all var(--transition);
        min-height: var(--touch-target);
      }

      .pagination button:hover:not(:disabled) {
        background: var(--primary-light);
        transform: translateY(-2px);
      }

      .pagination button:disabled {
        background: #ccc;
        color: #666;
        cursor: not-allowed;
        transform: none;
      }

      .no-results {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-light);
        font-size: 1.1em;
        width: 100%;
      }

      @media (max-width: 1200px) {
        .video-card {
          width: 320px;
        }
      }

      @media (max-width: 900px) {
        .video-card {
          width: 300px;
        }
      }

      @media (max-width: 768px) {
        .videos-container {
          padding: 20px 15px;
        }

        .video-card {
          width: 300px;
          padding: 14px;
        }

        .search-wrapper .search-container {
          max-width: 100%;
        }

        .pagination {
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }

        .pagination button {
          width: 200px;
          max-width: 100%;
        }

        .pagination span {
          min-width: auto;
        }
      }

      @media (max-width: 480px) {
        .video-card {
          width: 100%;
        }

        .video-title {
          font-size: 1.05em;
        }
        .play-button {
          width: 50px;
          height: 50px;
          font-size: 24px;
        }
      }
    </style>
  </head>

        <div class="nav-links" id="navLinks">
          <a href="index.html" data-en="Home" data-hi="होम">Home</a>
          <a href="audios.html" data-en="Audio" data-hi="ऑडियो">Audio</a>
          <a
            href="vids.html"

            data-en="Video"

          >

    <div class="videos-container" id="main-content">
      <div class="page-header">
        <h1 data-en="Spiritual Videos" data-hi="आध्यात्मिक वीडियो">
          Spiritual Videos
        </h1>
        <p
          data-en="Watch enlightening discourses, bhajans, and spiritual teachings"
          data-hi="प्रेरक प्रवचन, भजन और आध्यात्मिक शिक्षाएं देखें"
        >
          Watch enlightening discourses, bhajans, and spiritual teachings
        </p>
      </div>

      <div class="instruction-banner">
        <span class="hint-icon" data-icon="video"></span>
        <span
          data-en="Tap a video thumbnail to play. Use search to find specific videos."
          data-hi="वीडियो चलाने के लिए थंबनेल पर टैप करें। विशिष्ट वीडियो खोजने के लिए खोज का उपयोग करें।"
          >Tap a video thumbnail to play. Use search to find specific
          videos.</span
        >
      </div>

      <div class="search-wrapper">
        <div class="search-container">
          <input
            type="text"
            id="searchInput"
            data-en-placeholder="Search videos..."
            data-hi-placeholder="वीडियो खोजें..."
            placeholder="Search videos..."
            oninput="filterVideos()"
          />
        </div>
      </div>

      <div class="videos-grid" id="videoGrid">
        <div
          class="loading"
          data-en="Loading videos..."
          data-hi="वीडियो लोड हो रहे हैं..."
        >
          Loading videos...
        </div>
      </div>

      <div class="pagination" id="pagination">
        <button id="prevBtn" disabled data-en="Previous" data-hi="पिछला">
          Previous
        </button>
        <span
          id="pageInfo"
          style="
            font-size: 1em;
            color: var(--text-light);
            font-weight: bold;
            min-width: 120px;
            text-align: center;
          "
        ></span>
        <button id="nextBtn" disabled data-en="Next" data-hi="अगला">
          Next
        </button>
      </div>
    </div>

    <footer class="contact-bar">
      <p
        data-en="Contact us for more information"
        data-hi="अधिक जानकारी के लिए संपर्क करें"

        Contact us for more information

    <button class="back-to-top" id="backToTop" aria-label="Back to top">
      <span data-icon="arrow-up"></span>

    <script src="icons.js?v=2"></script>
    <script src="nav.js?v=2"></script>
    <script>
      var playlistId = "PLEPUNw4tYLWXESnlHMz1nbqAtvHU75yim";
      var maxResults = 50;
      var allVideos = [];
      var filteredVideos = [];
      var currentPage = 0;
      var ITEMS_PER_PAGE = 6;

      function extractVideoId(item) {
        return item.snippet.resourceId
          ? item.snippet.resourceId.videoId
          : item.snippet.videoId;
      }

      async function loadVideos() {
        var grid = document.getElementById("videoGrid");

        try {
          var res = await fetch(
            "/api/videos?playlistId=" +
              playlistId +
              "&maxResults=" +
              maxResults,
          );

          if (!res.ok) {
            throw new Error("Failed to fetch videos");
          }

          var data = await res.json();

          if (data.items && data.items.length > 0) {
            data.items.forEach(function (item) {
              var vid = extractVideoId(item);
              var exists = allVideos.some(function (v) {
                return v.videoId === vid;
              });
              if (!exists) {
                allVideos.push({
                  videoId: vid,
                  title: item.snippet.title,
                  description: item.snippet.description || "",
                });
              }
            });

            filteredVideos = allVideos.slice();
            currentPage = 0;
            displayPage();
            updatePagination();
          } else {
            grid.innerHTML =
              '<div class="no-results"><span data-en="No videos found. Please check back later." data-hi="कोई वीडियो नहीं मिला। कृपया बाद में देखें।">No videos found. Please check back later.</span></div>';
          }
        } catch (error) {
          console.error("Error loading videos:", error);
          grid.innerHTML =
            '<div class="error-message"><h3 data-en="Unable to load videos" data-hi="वीडियो लोड करने में असमर्थ">Unable to load videos</h3><p data-en="Please check your internet connection." data-hi="कृपया अपना इंटरनेट कनेक्शन जांचें।">Please check your internet connection.</p></div>';
        }
      }

      function displayPage() {
        var grid = document.getElementById("videoGrid");
        var start = currentPage * ITEMS_PER_PAGE;
        var end = start + ITEMS_PER_PAGE;
        var pageItems = filteredVideos.slice(start, end);

        if (pageItems.length === 0) {
          grid.innerHTML =
            '<div class="no-results"><span data-en="No videos match your search." data-hi="आपकी खोज से कोई वीडियो मेल नहीं खाता।">No videos match your search.</span></div>';
          return;
        }

        grid.innerHTML = pageItems
          .map(function (video) {
            return (
              '<div class="video-card">' +
              '<div class="video-thumb-wrapper" onclick="playVideo(this, \'' +
              video.videoId +
              "')\">" +
              '<img src="https://img.youtube.com/vi/' +
              video.videoId +
              '/hqdefault.jpg" alt="' +
              video.title +
              '" loading="lazy" />' +
              '<div class="play-button">' +
              window.iconSVG("play") +
              "</div>" +
              "</div>" +
              '<div class="video-card-body">' +
              '<div class="video-title">' +
              video.title +
              "</div>" +
              "</div>" +
              "</div>"
            );
          })
          .join("");
      }

      function playVideo(wrapper, videoId) {
        wrapper.innerHTML =
          '<iframe class="video-iframe" src="https://www.youtube.com/embed/' +
          videoId +
          '?autoplay=1" allowfullscreen allow="autoplay"></iframe>';
      }

      function filterVideos() {
        var searchTerm = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();

        filteredVideos = allVideos.filter(function (v) {
          return (
            searchTerm === "" ||
            v.title.toLowerCase().includes(searchTerm) ||
            v.description.toLowerCase().includes(searchTerm)
          );
        });

        currentPage = 0;
        displayPage();
        updatePagination();
      }

      function updatePagination() {
        var totalPages = Math.ceil(filteredVideos.length / ITEMS_PER_PAGE);
        var pageInfo = document.getElementById("pageInfo");
        document.getElementById("prevBtn").disabled =
          currentPage === 0 || totalPages <= 1;
        document.getElementById("nextBtn").disabled =
          currentPage >= totalPages - 1 || totalPages <= 1;
        if (pageInfo) {
          pageInfo.textContent =
            totalPages <= 1
              ? ""
              : "Page " + (currentPage + 1) + " of " + totalPages;
        }
      }

      document.getElementById("nextBtn").onclick = function () {
        var totalPages = Math.ceil(filteredVideos.length / ITEMS_PER_PAGE);
        if (currentPage < totalPages - 1) {
          currentPage++;
          displayPage();
          updatePagination();
          document
            .querySelector(".page-header")
            .scrollIntoView({ behavior: "smooth" });
        }
      };

      document.getElementById("prevBtn").onclick = function () {
        if (currentPage > 0) {
          currentPage--;
          displayPage();
          updatePagination();
          document
            .querySelector(".page-header")
            .scrollIntoView({ behavior: "smooth" });
        }
      };

      loadVideos();
    </script>
  </body>
